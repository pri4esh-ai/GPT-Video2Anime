name: Build GPT Video2Anime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: video2anime-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare bundled AnimeGANv3 model
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/models"
          MODEL_FILE="$MODEL_DIR/AnimeGANv3_Hayao_36.onnx"
          MODEL_URL="https://github.com/TachibanaYoshino/AnimeGANv3/releases/download/v1.1.0/AnimeGANv3_Hayao_36.onnx"
          EXPECTED_SHA256="95ba7b219073fd5b12f569bc38056ffd3019cf4caf15b1feb9f73d1286c9f69d"

          mkdir -p "$MODEL_DIR"

          echo "Downloading AnimeGANv3..."
          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "$MODEL_FILE" \
            "$MODEL_URL"

          echo "Verifying AnimeGANv3 SHA-256..."

          ACTUAL_SHA256="$(sha256sum "$MODEL_FILE" | awk '{print $1}')"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: AnimeGANv3 SHA-256 mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            exit 1
          fi

          echo "AnimeGANv3 SHA-256 verified."

          ls -lh "$MODEL_FILE"

      - name: Verify existing Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/gptvideo2anime/MainActivity.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessor.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessingService.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/inference/OnnxAnimeEngine.kt

          test -f \
            app/src/main/assets/models/AnimeGANv3_Hayao_36.onnx

          echo "Android project validation passed."

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x ./gradlew

          ./gradlew --version

      - name: Validate project
        shell: bash
        run: |
          set -e

          git diff --check

          echo "Checking MediaCodec implementation..."

          grep -q \
            '!info.isEncoder' \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          grep -q \
            'info.isEncoder' \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          echo "MediaCodec validation passed."

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Video2Anime-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "GPT Video2Anime BUILD SUCCESSFUL"
          echo "========================================"
          echo
          echo "Bundled model:"
          ls -lh app/src/main/assets/models/AnimeGANv3_Hayao_36.onnx
          echo
          echo "APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
