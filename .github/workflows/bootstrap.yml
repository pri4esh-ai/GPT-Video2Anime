name: Build GPT Video2Anime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: video2anime-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # VERIFY EXISTING PROJECT
      #
      # IMPORTANT:
      # Do NOT generate or overwrite project files here.
      # The repository itself is the source of truth.
      # ============================================================
      - name: Verify existing Android project
        shell: bash
        run: |
          set -e

          echo "GPT Video2Anime project"
          echo "======================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/gptvideo2anime/MainActivity.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessor.kt

          test -f \
            app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessingService.kt

          echo
          echo "Source tree:"
          find app/src/main -type f | sort

      # ============================================================
      # GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x ./gradlew

          ./gradlew --version

      # ============================================================
      # STATIC VALIDATION
      # ============================================================
      - name: Validate project
        shell: bash
        run: |
          set -e

          echo "Running whitespace validation..."
          git diff --check

          echo
          echo "Checking MediaCodec implementation..."

          grep -q \
            '!info.isEncoder' \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          grep -q \
            'info.isEncoder' \
            app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          echo
          echo "Checking for invalid isDecoder reference..."

          if grep -RIn --exclude-dir=.git \
              'isDecoder' \
              app/src/main/java; then

            echo "ERROR: invalid isDecoder symbol found."
            exit 1
          fi

          echo "OK: MediaCodec validation passed."

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo
          echo "APK successfully generated:"
          ls -lh "$APK"

      # ============================================================
      # APK ARTIFACT
      # ============================================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Video2Anime-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # REPORT
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "GPT Video2Anime BUILD SUCCESSFUL"
          echo "========================================"
          echo
          echo "APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo
          echo "The repository source was NOT regenerated."
          echo "Committed source files remain authoritative."
