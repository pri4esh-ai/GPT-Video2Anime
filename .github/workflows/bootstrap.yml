          cat > models/README.md <<'EOF'
          # Anime ONNX model

          The application expects an offline ONNX model named:

          `anime.onnx`

          It is copied to:

          `Android/data/com.gptvideo2anime/files/models/anime.onnx`

          The model must accept:

          `[1,3,H,W]`

          RGB floating-point input normalized to:

          `0..1`

          and return:

          `[1,3,H,W]`

          RGB floating-point output normalized to:

          `0..1`

          IMPORTANT:

          A real anime model is required for actual anime transformation.
          The application does not download models during processing.

          Recommended future model requirements:

          - temporal consistency
          - realistic anime rendering
          - identity preservation
          - face detail preservation
          - arbitrary-resolution tiling
          - mobile-friendly ONNX operators
          - INT8/FP16 optimization
          - CPU/NNAPI compatibility
          EOF

