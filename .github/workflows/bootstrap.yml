name: Build GPT Video2Anime

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: video2anime-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare bundled ONNX models
        shell: bash
        run: |
          set -e

          MODEL_DIR="app/src/main/assets/models"
          mkdir -p "$MODEL_DIR"

          echo "Downloading AnimeGANv3 JP Face..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "$MODEL_DIR/AnimeGANv3_JP_face.onnx" \
            "https://github.com/TachibanaYoshino/AnimeGANv3/releases/download/v1.1.0/AnimeGANv3_JP_face.onnx"

          echo "Downloading RealESR..."

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "$MODEL_DIR/RealESR-AnimeVideo-v3_x4.onnx" \
            "https://huggingface.co/tidus2102/Real-ESRGAN/resolve/main/RealESR-AnimeVideo-v3_x4.onnx"

          echo
          echo "Bundled models:"
          ls -lh "$MODEL_DIR"

      - name: Verify existing Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/gptvideo2anime/MainActivity.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessor.kt
          test -f app/src/main/java/com/gptvideo2anime/pipeline/VideoProcessingService.kt
          test -f app/src/main/java/com/gptvideo2anime/inference/OnnxAnimeEngine.kt

          test -f app/src/main/assets/models/AnimeGANv3_JP_face.onnx
          test -f app/src/main/assets/models/RealESR-AnimeVideo-v3_x4.onnx

          echo "Android project validation passed."

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew
          chmod +x ./gradlew
          ./gradlew --version

      - name: Validate project
        shell: bash
        run: |
          set -e

          git diff --check

          echo "Checking MediaCodec implementation..."

          grep -q '!info.isEncoder' app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt
          grep -q 'info.isEncoder' app/src/main/java/com/gptvideo2anime/pipeline/MediaCodecVideoEngine.kt

          if grep -RIn --exclude-dir=.git 'isDecoder' app/src/main/java; then
            echo "ERROR: invalid isDecoder symbol found."
            exit 1
          fi

          echo "MediaCodec validation passed."

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPT-Video2Anime-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "GPT Video2Anime BUILD SUCCESSFUL"
          echo "========================================"
          echo
          echo "Bundled models:"
          ls -lh app/src/main/assets/models
          echo
          echo "APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
